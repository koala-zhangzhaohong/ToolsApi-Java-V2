<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title th:text="${title}"></title>
    <link rel="preload" href="../assets/js/zwplayer/css/zwplayer.css"
          th:href="@{/assets/js/zwplayer/css/zwplayer.css(v=3.3.1)}" as="style">
    <!-- css js -->
    <script src="../assets/js/zwplayer/zwplayer.js" th:src="@{/assets/js/zwplayer/zwplayer.js(v=3.3.1)}"></script>
    <link href="../assets/css/custom-player.css" th:href="@{/assets/css/custom-player.css(v=20260811)}" rel="stylesheet">
</head>
<body class="custom-container">
<div class="zw-player-stage">
    <div id="video-player" class="zw-video-player-custom">
        <meta name="referrer" content="never">
    </div>
    <div id="player-loading" class="zw-player-loading is-visible" role="status" aria-live="polite">
        <span class="zw-player-loading-spinner"></span>
        <span>正在加载画面</span>
    </div>
</div>
<script>
    let zw;
    const videoElement = document.getElementById('video-player');
    const loadingElement = document.getElementById('player-loading');
    let firstFramePending = true;
    const qualityList = [];
    if (checkContentIsNotEmpty("[[${multi.getFullHd1()}]]")) {
        qualityList.push({
            name: '原画',
            url: '[[${multi.getFullHd1()}]]',
            default: checkContentIsNotEmpty("[[${multi.getFullHd1()}]]"),
        });
    }
    if (checkContentIsNotEmpty("[[${multi.getHd1()}]]")) {
        qualityList.push({
            name: '超清',
            url: '[[${multi.getHd1()}]]',
            default: !checkContentIsNotEmpty("[[${multi.getFullHd1()}]]"),
        });
    }
    if (checkContentIsNotEmpty("[[${multi.getSd1()}]]")) {
        qualityList.push({
            name: '高清',
            url: '[[${multi.getSd1()}]]',
            default: !checkContentIsNotEmpty("[[${multi.getFullHd1()}]]") && !checkContentIsNotEmpty("[[${multi.getHd1()}]]"),
        });
    }
    if (checkContentIsNotEmpty("[[${multi.getSd2()}]]")) {
        qualityList.push({
            name: '标清',
            url: '[[${multi.getSd2()}]]',
            default: !checkContentIsNotEmpty("[[${multi.getFullHd1()}]]") && !checkContentIsNotEmpty("[[${multi.getHd1()}]]") && !checkContentIsNotEmpty("[[${multi.getSd1()}]]"),
        });
    }

    function checkContentIsNotEmpty(input) {
        if (input && input.length > 0) {
            if (input !== "null" && input !== "") {
                return true;
            }
        }
        return false;
    }

    function checkIsMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|webOS|Windows Phone|SymbianOS|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function setPlayerLoading(loading) {
        loadingElement.classList.toggle('is-visible', loading);
    }

    function beginFirstFrameLoading() {
        firstFramePending = true;
        setPlayerLoading(true);
    }

    function finishFirstFrameLoading() {
        if (!firstFramePending) {
            return;
        }
        firstFramePending = false;
        setPlayerLoading(false);
    }

    function safeDestroyPlayer() {
        if (zw) {
            if (zw.paused) {
                zw.pause();
            }
            zw.destroy();
            zw = null;
            videoElement.innerHTML = '';
            console.log('[ZW player]', 'on destroy');
        }
    }

    function initZw() {
        beginFirstFrameLoading();
        safeDestroyPlayer();
        const info = {
            playerElm: 'video-player',
            url: qualityList,
            infoButton: true,
            optionButton: true,
            snapshotButton: true,
            controlbar: true,
            autoplay: true,
            isLive: false,
            onready: function () {
                console.log('[ZW player]', 'on ready');
            },
            onmediaevent: function (event) {
                console.log(event)
                if (['loadeddata', 'canplay', 'playing', 'timeupdate'].includes(event.type)) {
                    finishFirstFrameLoading();
                }
                if (['pause', 'ended'].includes(event.type)) {
                    setPlayerLoading(false);
                }
                switch (event.type) {
                    case 'play':
                        console.log('[ZW player]', '开始播放');
                        break;
                    case 'playing':
                        console.log('[ZW player]', '正在播放');
                        break;
                    case 'pause':
                        console.log('[ZW player]', '播放暂停');
                        break;
                    case 'seeking':
                        console.log('[ZW player]', '正在 seek');
                        break;
                    case 'seeked':
                        console.log('[ZW player]', 'seek 结束');
                        break;
                    case 'waiting':
                        console.log('[ZW player]', '正在等待');
                        break;
                    case 'ended':
                        console.log('[ZW player]', '播放结束');
                        break;
                    case 'error':
                        console.log('[ZW player]', '播放错误');
                        initZw();
                        break;
                }

            },
        };
        zw = new ZWPlayer(info);
    }

    document.addEventListener('DOMContentLoaded', function () {
        initZw();
    });
</script>
</body>
