x-common: &common
  restart: always
  networks:
    - traefik-gateway-v1

x-observability-limits: &observability-limits
  deploy:
    resources:
      limits:
        memory: 14G
        cpus: "10.00"

x-tools-api-limits: &tools-api-limits
  deploy:
    resources:
      limits:
        memory: 22G
        cpus: "14.00"

x-tools-api-labels: &tools-api-labels
  traefik.enable: "false"

x-observability-labels: &observability-labels
  traefik.enable: "false"
  com.koala.observability.stack: otel-lgtm
  com.koala.observability.otlp.grpc.endpoint: traefik-otel-lgtm:4317
  com.koala.observability.signals: accesslogs,metrics,tracing

x-traefik-labels: &traefik-labels
  <<: *observability-labels
  com.koala.observability.role: edge-gateway

x-otel-lgtm-labels: &otel-lgtm-labels
  <<: *observability-labels
  com.koala.observability.role: collector-dashboard

x-tools-api-service: &tools-api-service
  <<: [*common, *tools-api-limits]
  image: ${TOOLS_API_IMAGE:-tools-api-package:2.1.1.0-docker}
  labels: *tools-api-labels
  environment:
    SPRING_PROFILES_ACTIVE: docker
    TZ: Asia/Shanghai
    JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 90s
  depends_on:
    - traefik

x-tools-api-environment: &tools-api-environment
  SPRING_PROFILES_ACTIVE: docker
  TZ: Asia/Shanghai
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai

x-tools-api-web-service: &tools-api-web-service
  <<: [*common]
  image: ${TOOLS_API_WEB_IMAGE:-tools-api-web-package:2.1.1.0-docker}
  labels: *tools-api-labels
  environment:
    TZ: Asia/Shanghai
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 15s
  depends_on:
    - traefik

services:
  traefik-otel-lgtm:
    <<: [*common, *observability-limits]
    image: grafana/otel-lgtm:latest
    container_name: traefik-otel-lgtm
    labels: *otel-lgtm-labels
    ports:
      - "56003:3000"
    environment:
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_PLUGINS_ENABLE_ALPHA: "true"
      GF_ALLOW_EMBEDDING: "true"
      GF_grafanaconThemes: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: provisioning,kubernetesDashboards
      TZ: Asia/Shanghai
      LOKI_ARGS: --pattern-ingester.enabled=true
    volumes:
      - /www/docker/otel-lgtm/data:/data
      - /www/docker/otel-lgtm/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards
      - /www/docker/otel-lgtm/loki/config/loki-config.yaml:/otel-lgtm/loki-config.yaml

  traefik:
    <<: [*common, *observability-limits]
    image: traefik:v3.7.7
    container_name: traefik-gateway-v1
    command:
      - "--accessLog.otlp.grpc.endpoint=traefik-otel-lgtm:4317"
      - "--metrics.otlp.grpc.endpoint=traefik-otel-lgtm:4317"
      - "--tracing.otlp.grpc.endpoint=traefik-otel-lgtm:4317"
    labels: *traefik-labels
    security_opt:
      - no-new-privileges:true
    ports:
      - "56000:80"
      - "56443:443/tcp"
      - "56443:443/udp"
      - "56001:8080"
      - "56002:8082"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /www/docker/traefik/v1/traefik.yml:/traefik.yml:ro
      - /www/docker/traefik/v1/logs:/etc/traefik/logs
      - /www/docker/traefik/v1/config:/etc/traefik/config
      - /www/docker/traefik/v1/certs:/etc/traefik/certs
      - /etc/localtime:/etc/localtime
    depends_on:
      - traefik-otel-lgtm

  traefik-middleware-multiple-1:
    <<: *tools-api-service
    container_name: traefik-middleware-multiple-1
    hostname: traefik-middleware-multiple-1
    environment:
      <<: *tools-api-environment
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: tools-api-traefik-middleware-multiple-1
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://traefik-middleware-multiple-1:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://traefik-middleware-multiple-1:8080/actuator/health

  traefik-middleware-multiple-2:
    <<: *tools-api-service
    container_name: traefik-middleware-multiple-2
    hostname: traefik-middleware-multiple-2
    environment:
      <<: *tools-api-environment
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: tools-api-traefik-middleware-multiple-2
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://traefik-middleware-multiple-2:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://traefik-middleware-multiple-2:8080/actuator/health

  traefik-middleware-multiple-3:
    <<: *tools-api-service
    container_name: traefik-middleware-multiple-3
    hostname: traefik-middleware-multiple-3
    environment:
      <<: *tools-api-environment
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: tools-api-traefik-middleware-multiple-3
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://traefik-middleware-multiple-3:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://traefik-middleware-multiple-3:8080/actuator/health

  traefik-middleware-web-multiple-1:
    <<: *tools-api-web-service
    container_name: traefik-middleware-web-multiple-1

  traefik-middleware-web-multiple-2:
    <<: *tools-api-web-service
    container_name: traefik-middleware-web-multiple-2

networks:
  traefik-gateway-v1:
    external: true
    driver: bridge
